<h1>Bank Accounts</h1>

<div class="cards">
  @for (acc of accounts(); track acc.id) {
    @if (acc.active){
    <mat-card 
      class="card"
      (click)="selectAccount(acc)"
    >
      <mat-card-header>
        <mat-card-title>{{ acc.title }}</mat-card-title>
      </mat-card-header>
      
      <mat-card-content>
        <p>{{ acc.balance | currency:'R' }}</p>
      </mat-card-content>
    </mat-card>
  }
  } @empty {
    <p>No accounts found.</p>
  }
</div>

@let selected = selectedAccount();

@if (selected) {
  <app-account-details
    [balance]="selected.balance"
    [accountNumber]="selected.accountNumber"
    [title]="selected.title"
    (closed)="closeDetails()"
  >
  </app-account-details>
}
