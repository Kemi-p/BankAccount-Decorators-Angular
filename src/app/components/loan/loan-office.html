<div class="nav">
  <button class="logout" (click)="logout()">Logout</button>

</div>
<div class="page">

  <h2>Loan Office</h2>

 
  <div class="user-bar">
    @if (user$ | async; as user) {
      <div class="user-info">
        Logged in as:
        <strong>{{ user.name }}</strong>
        ({{ user.role }})
      </div>
    }
  </div>

 
  <div class="card loans">
    <h3>Loan Requests</h3>

    <ul>
      @if (loans$ | async; as loans) {
        @for (loan of loans; track loan.id) {
          <li class="loan-item">

            <div class="loan-info">
              <strong>{{ loan.character }}</strong>
              <span>→ {{ loan.asset }}</span>
            </div>

            <div class="loan-meta">

              <span class="status {{ loan.status }}">
                {{ loan.status }}
              </span>

              @if (loan.status === 'pending') {
                <button class="approve" (click)="approve(loan.id)">
                  Approve
                </button>

                <button class="reject" (click)="reject(loan.id)">
                  Reject
                </button>
              }

            </div>

          </li>
        }
      }
    </ul>

  </div>

</div>
